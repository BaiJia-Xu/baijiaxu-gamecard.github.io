        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        ptcgGold: '#d4af37',
                        ptcgDark: '#1e1e24',
                    }
                }
            }
        }

    <style>
        body {
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        /* Fixed-size PTCG card dimensions for 1:1 screen & PNG export fidelity */
        .ptcg-card-box {
            width: 330px;
            height: 475px;
            box-sizing: border-box;
            border-radius: 18px;
            position: relative;
            overflow: hidden;
            user-select: none;
            flex-shrink: 0;
            font-family: 'Noto Sans TC', 'Microsoft JhengHei', 'PingFang TC', sans-serif;
        }

        /* Holographic Holo Foil Effect */
        .card-holo {
            position: relative;
        }
        .card-holo::after {
            content: "";
            position: absolute;
            top: -100%;
            left: -100%;
            width: 300%;
            height: 300%;
            background: linear-gradient(
                115deg,
                transparent 20%,
                rgba(255, 255, 255, 0.22) 30%,
                rgba(255, 0, 128, 0.12) 40%,
                rgba(0, 255, 255, 0.15) 50%,
                rgba(255, 230, 0, 0.18) 60%,
                transparent 70%
            );
            pointer-events: none;
            transition: transform 0.5s ease;
            opacity: 0.7;
            mix-blend-mode: color-dodge;
            z-index: 20;
        }
        .ptcg-card-box:hover .card-holo::after {
            transform: translate(15%, 15%);
        }

        /* Safe text wrapper to prevent baseline shifts and off-screen rendering */
        .card-text-safe {
            line-height: 1.35;
            display: inline-block;
            vertical-align: middle;
            margin: 0;
            padding: 0;
        }

        /* Standard PTCG Card Golden/Rainbow/Debuff Borders */
        .ptcg-border-item {
            background: linear-gradient(135deg, #e2e8f0 0%, #93c5fd 35%, #3b82f6 70%, #1e40af 100%);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.4);
        }
        .ptcg-border-debuff {
            background: linear-gradient(135deg, #f3e8ff 0%, #c084fc 35%, #8b5cf6 70%, #581c87 100%);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }
        .ptcg-border-gold {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 35%, #ca8a04 70%, #854d0e 100%);
            box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.4);
        }

        /* Printable setup */
        @media print {
            body {
                background: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .print-grid {
                display: grid !important;
                grid-template-columns: repeat(2, 330px) !important;
                gap: 15mm !important;
                justify-content: center;
                padding: 10mm !important;
            }
            .ptcg-card-box {
                break-inside: avoid;
                page-break-inside: avoid;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="no-print bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-yellow-500 via-amber-400 to-amber-200 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
                    <i class="fa-solid fa-shuttlecock"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight text-white flex items-center gap-2">
                        羽球趣味賽卡牌工作室 <span class="text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full font-mono">PTCG 完美下載版</span>
                    </h1>
                    <p class="text-xs text-slate-400">改善下載圖片位移與裁切問題，可自由編輯與印製高質感卡牌</p>
                </div>
            </div>

            <!-- Header Actions -->
            <div class="flex items-center gap-2 flex-wrap">
                <button onclick="addNewCard()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded-lg border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-plus text-amber-400"></i> 新增自訂卡牌
                </button>
                <button onclick="triggerRandomDraw()" class="px-3 py-1.5 bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-dice"></i> 隨機抽限制卡
                </button>
                <button onclick="toggleHoloEffect()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-sparkles"></i> <span id="holoToggleText">切換閃卡特效</span>
                </button>
                <button onclick="window.print()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-print"></i> 列印卡牌 (A4)
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- LEFT/TOP: Filter & Card Display Container (7-8 cols) -->

            <!-- Filter Bar -->

                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">篩選：</span>
                    <button onclick="filterCards('all')" id="btn-filter-all" class="filter-btn px-3 py-1 text-xs rounded-lg font-medium bg-amber-500 text-slate-950 font-bold">全部 (<span id="count-all">8</span>)</button>
                    <button onclick="filterCards('item')" id="btn-filter-item" class="filter-btn px-3 py-1 text-xs rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">道具卡 (<span id="count-item">4</span>)</button>
                    <button onclick="filterCards('debuff')" id="btn-filter-debuff" class="filter-btn px-3 py-1 text-xs rounded-lg font-medium bg-slate-700 text-slate-300 hover:bg-slate-600">限制卡 (<span id="count-debuff">4</span>)</button>
                </div>
                <div class="text-xs text-slate-400 flex items-center gap-1">
                    <i class="fa-solid fa-circle-check text-emerald-400"></i> 已修復：下載圖檔與螢幕呈現 100% 一致
                </div>
            </div>

            <!-- Printable & Viewable Grid -->
            <div id="cardsDisplayGrid" class="print-grid flex flex-wrap gap-6 justify-center md:justify-start">
                <!-- Dynamic Cards inserted here -->
            </div>
        </section>

        <!-- RIGHT: Card Live Editor Drawer (4-5 cols) -->
        <section class="lg:col-span-5 xl:col-span-4 no-print">
            <div class="sticky top-20 bg-slate-800/90 rounded-2xl border border-slate-700/80 p-5 shadow-2xl backdrop-blur-md">
                <div class="flex items-center justify-between border-b border-slate-700 pb-3 mb-4">
                    <h2 class="font-bold text-slate-100 flex items-center gap-2">
                        <i class="fa-solid fa-pen-to-square text-amber-400"></i> 卡面即時編輯器
                    </h2>
                    <span id="editingCardTag" class="text-xs bg-slate-700 text-amber-300 font-mono px-2 py-0.5 rounded">選擇卡片中</span>
                </div>

                <form id="editorForm" onsubmit="event.preventDefault();" class="space-y-4 max-h-[calc(100vh-180px)] overflow-y-auto pr-1">
                    <input type="hidden" id="edit-id">

                    <!-- Basic Properties -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 font-medium mb-1">卡牌類型</label>
                            <select id="edit-type" onchange="updateCurrentCardFromForm()" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                                <option value="item">道具卡 (Item)</option>
                                <option value="debuff">限制卡 (Debuff)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 font-medium mb-1">外框風格</label>
                            <select id="edit-borderStyle" onchange="updateCurrentCardFromForm()" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                                <option value="ptcg-border-item">藍色銀邊 (經典道具)</option>
                                <option value="ptcg-border-debuff">紫色暗邊 (詛咒限制)</option>
                                <option value="ptcg-border-gold">黃金金卡 (極稀有)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Title & Header Limit -->
                    <div class="grid grid-cols-3 gap-3">
                        <div class="col-span-2">
                            <label class="block text-xs text-slate-400 font-medium mb-1">卡牌名稱 (【】內文字)</label>
                            <input type="text" id="edit-title" oninput="updateCurrentCardFromForm()" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 font-medium mb-1">角標標籤</label>
                            <input type="text" id="edit-limitTag" oninput="updateCurrentCardFromForm()" placeholder="每局1次" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                        </div>
                    </div>

                    <!-- Artwork Section -->
                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">卡面圖案 / 圖示 (FontAwesome 類別或圖片)</label>
                        <div class="flex gap-2">
                            <input type="text" id="edit-iconClass" oninput="updateCurrentCardFromForm()" placeholder="fa-solid fa-people-group" class="flex-1 bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none font-mono">
                            <label class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg border border-slate-600 cursor-pointer flex items-center justify-center text-slate-200">
                                <span>上傳圖片</span>
                                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </label>
                        </div>
                    </div>

                    <!-- Subhead Line -->
                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">圖案下說明細項條 (Sub-header Bar)</label>
                        <input type="text" id="edit-subInfo" oninput="updateCurrentCardFromForm()" placeholder="羽球道具組 No.001 • 戰術支援" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                    </div>

                    <!-- Ability Section -->
                    <div class="p-3 bg-slate-900/60 rounded-xl border border-slate-700/50 space-y-3">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs text-slate-400 font-medium mb-1">技能徽章 (如: 特性/限制)</label>
                                <input type="text" id="edit-abilityBadge" oninput="updateCurrentCardFromForm()" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 font-medium mb-1">技能名稱</label>
                                <input type="text" id="edit-abilityName" oninput="updateCurrentCardFromForm()" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 font-medium mb-1">技能效果詳細描述</label>
                            <textarea id="edit-description" rows="3" oninput="updateCurrentCardFromForm()" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none leading-relaxed"></textarea>
                        </div>
                    </div>

                    <!-- Bottom Bar -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs text-slate-400 font-medium mb-1">持續時間 / 時效標示</label>

                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 font-medium mb-1">卡號標記</label>
                            <input type="text" id="edit-cardNumber" oninput="updateCurrentCardFromForm()" placeholder="NO.001/008 ★" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none font-mono">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs text-slate-400 font-medium mb-1">卡底趣味風趣語 (Flavor Text)</label>
                        <input type="text" id="edit-flavor" oninput="updateCurrentCardFromForm()" placeholder="「場外也是戰場的一部分...」" class="w-full bg-slate-900 border border-slate-700 text-sm rounded-lg px-2.5 py-1.5 text-white focus:ring-2 focus:ring-amber-500 outline-none italic">
                    </div>

                    <!-- Actions -->
                    <div class="pt-2 flex gap-2">
                        <button onclick="exportCurrentCardPNG()" class="flex-1 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm rounded-xl transition flex items-center justify-center gap-2 shadow-lg">
                            <i class="fa-solid fa-download"></i> 下載此卡片 (高清 PNG)
                        </button>
                        <button onclick="duplicateCard()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium text-sm rounded-xl transition" title="複製卡牌">
                            <i class="fa-solid fa-copy"></i>
                        </button>
                        <button onclick="deleteCurrentCard()" class="px-3 py-2 bg-rose-900/60 hover:bg-rose-800 text-rose-200 font-medium text-sm rounded-xl border border-rose-700/50 transition" title="刪除卡牌">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <!-- Random Draw Modal -->
    <div id="drawModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-purple-500/40 rounded-3xl p-6 max-w-md w-full shadow-2xl text-center space-y-6 transform transition-all scale-95 opacity-0" id="drawModalContent">

                <h3 class="text-2xl font-black text-white">本局抽中限制卡！</h3>
            </div>

            <!-- Card Container for Draw Slot -->
            <div id="drawnCardContainer" class="flex justify-center my-4 overflow-hidden py-2">
                <!-- Drawn Card rendered here -->
            </div>

            <div class="flex gap-3 justify-center">
                <button onclick="triggerRandomDraw()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-rotate"></i> 再抽一次

                <button onclick="closeDrawModal()" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl transition">
                    確定關閉
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-amber-500 text-slate-950 px-4 py-3 rounded-xl font-bold shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-check-circle"></i> <span id="toastMsg">提示訊息</span>
    </div>

            if (iconClass.includes('volume-xmark') || iconClass.includes('volume')) {

        function triggerRandomDraw() {
            const debuffCards = cardDataList.filter(c => c.type === 'debuff');
            if (debuffCards.length === 0) {
                showToast('沒有可抽取的限制卡！');
                return;
            }

            const modal = document.getElementById('drawModal');
            const modalContent = document.getElementById('drawModalContent');
            const drawnContainer = document.getElementById('drawnCardContainer');

            modal.classList.remove('hidden');
            setTimeout(() => {
                modalContent.classList.remove('scale-95', 'opacity-0');
                modalContent.classList.add('scale-100', 'opacity-100');
            }, 10);

            let rolls = 0;
            const interval = setInterval(() => {
                const randomCard = debuffCards[Math.floor(Math.random() * debuffCards.length)];
                drawnContainer.innerHTML = createCardHTML(randomCard);
                rolls++;
                if (rolls >= 10) {
                    clearInterval(interval);
                }
            }, 80);
        }

        function closeDrawModal() {
            const modal = document.getElementById('drawModal');
            const modalContent = document.getElementById('drawModalContent');
            modalContent.classList.remove('scale-100', 'opacity-100');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        }

        async function exportCurrentCardPNG() {
            const cardNode = document.getElementById(`card-node-${activeCardId}`);
            if (!cardNode) return;

            showToast('正在生成 1:1 精準畫質圖片...');

            // Ensure fonts are fully loaded
            if (document.fonts) {
                await document.fonts.ready;
            }

            const card = cardDataList.find(c => c.id === activeCardId);
            const fileName = `羽球卡牌_${card ? card.title : 'Card'}.png`;

            // Primary render engine: htmlToImage (SVG foreignObject)
            try {
                if (window.htmlToImage) {
                    // fontEmbedCSS: '' disables cross-origin stylesheet scanning to bypass SecurityError on CDN stylesheets
                    const dataUrl = await htmlToImage.toPng(cardNode, {
                        pixelRatio: 3,
                        fontEmbedCSS: '',
                        cacheBust: true,
                        style: {
                            transform: 'none',
                            margin: '0',
                        }
                    });
                    
                    triggerDownload(dataUrl, fileName);
                    showToast('已完成 100% 精準無位移 PNG 下載！');
                    return;
                }
            } catch (err) {
                console.warn('htmlToImage capture error, using html2canvas fallback', err);
            }

            // Fallback renderer using html2canvas
            try {
                const canvas = await html2canvas(cardNode, {
                    scale: 3,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: null,
                    logging: false,
                    width: 330,
                    height: 475,
                    onclone: (clonedDoc) => {
                        const clonedCard = clonedDoc.getElementById(`card-node-${activeCardId}`);
                        if (clonedCard) {
                            clonedCard.style.transform = 'none';
                            clonedCard.classList.remove('card-holo');
                        }
                    }
                });
                const image = canvas.toDataURL("image/png");
                triggerDownload(image, fileName);
                showToast('已完成高畫質卡牌 PNG 下載！');
            } catch (err) {
                console.error(err);
                showToast('下載失敗，請直接嘗試截圖');
            }
        }

        function triggerDownload(dataUrl, fileName) {
            const link = document.createElement('a');
            link.download = fileName;
            link.href = dataUrl;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
